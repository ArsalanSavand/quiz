<!-- Header -->
<div class="py-3 position-sticky sticky-top bg-body-tertiary border-bottom">
  <div class="container mw-md d-flex align-items-center gap-3">

    <!-- App logo -->
    <img [height]="32"
         [width]="32"
         alt="Quiz"
         class="p-2 bg-light-subtle rounded border"
         height="512"
         ngSrc="favicon.png"
         width="512">

    <!-- App name (link) -->
    <a class="fw-bold" routerLink="/">Quiz</a>

    <!-- Spacer -->
    <span class="mx-auto"></span>

    <!-- Theme -->
    <button (click)="themeService.cycle()"
            class="btn btn-sm btn-link"
            title="Change theme">
      <div class="material-symbols-outlined">
        @if (themeService.isSyncedWithDevice()) {
          contrast
        } @else if (themeService.theme() === Theme.Light) {
          light_mode
        } @else {
          dark_mode
        }
      </div>
    </button>
  </div>
</div>

<!-- Page -->
<div class="Page">
  <router-outlet/>
</div>

<!-- Background effects -->
<div class="background-effects">
  <div class="effect"></div>
  <div class="effect"></div>
</div>
